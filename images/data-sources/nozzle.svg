<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Background Color -->
  <rect width="500" height="500" fill="#0b6b8b" />
  
  <!-- Geometric Logo Paths -->
  <g fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="square" stroke-linejoin="miter">
    <!-- Left Vertical Boundary Line -->
    <line x1="100" y1="80" x2="100" y2="420" />
    
    <!-- Right Vertical Boundary Line -->
    <line x1="400" y1="80" x2="400" y2="420" />
    
    <!-- Diagonal Segment: Top-Left to Middle-Right -->
    <line x1="100" y1="80" x2="400" y2="245" />
    
    <!-- Diagonal Segment: Middle-Left to Bottom-Right -->
    <line x1="100" y1="245" x2="400" y2="420" />
    
    <!-- Inner Geometric Connectors -->
    <line x1="100" y1="245" x2="225" y2="315" />
    <line x1="275" y1="175" x2="400" y2="245" />
  </g>
</svg>
